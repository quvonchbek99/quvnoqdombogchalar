<style>
:root{--bg:#f4f2ee;--card:#ffffff;--ink:#1d2230;--dim:#6b7280;--line:#e3dfd7;--fill:#ffffff;--eye:#1d2230;--kc:#3b82f6;--kg:rgba(59,130,246,.45);--red:#ef4444;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1220;--card:#181c30;--ink:#e9edf7;--dim:#9aa3b8;--line:#2a3150;--fill:#f8fafc;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1220;--card:#181c30;--ink:#e9edf7;--dim:#9aa3b8;--line:#2a3150;--fill:#f8fafc;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.top{display:flex;align-items:center;gap:6px;padding:10px 132px 4px 132px;min-height:56px}
.top h1{font:800 15px/1.1 Unbounded,"Golos Text",sans-serif;margin:0 auto 0 0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{border:1px solid var(--line);background:var(--card);border-radius:12px;min-width:42px;height:42px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:15px}
.ib:hover{border-color:var(--kc)}
.ib:focus-visible,.chip:focus-visible,.mic:focus-visible,.kv:focus-visible{outline:3px solid var(--kc);outline-offset:2px}
.pill{font-size:13px;font-weight:600}
.pill i{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block}
.pill.ai i{background:#22c55e}.pill.off i{background:#f59e0b}
.modes{display:flex;gap:6px;overflow-x:auto;padding:6px 12px 2px;scrollbar-width:none}
.modes::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.modes select{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 10px;font:600 14px "Golos Text",sans-serif}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 16px 0;min-height:0;position:relative}
.kvw{position:relative;display:grid;place-items:center;margin-top:4px}
.aura{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,var(--kg) 0%,transparent 62%);opacity:0;transition:opacity .4s;pointer-events:none}
.kv.listen~.aura,.kvw.listen .aura{opacity:1;animation:aur 1.2s ease-in-out infinite}
@keyframes aur{0%,100%{transform:scale(.92)}50%{transform:scale(1.06)}}
.kv{position:relative;border:0;background:none;padding:0;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:40px}
.kv svg{display:block;width:min(70vw,330px,42vh);height:auto;overflow:visible}
.kv .shp{fill:var(--fill);stroke:var(--kc);stroke-width:15;stroke-linejoin:round;opacity:0;transform:scale(.5) rotate(-35deg);transform-box:fill-box;transform-origin:center;transition:stroke .45s,opacity .3s,transform .6s cubic-bezier(.34,1.56,.64,1)}
.kv .shp.on{opacity:1;transform:none}
.kv .bodyg{filter:drop-shadow(0 0 16px var(--kg));transform-box:view-box;transform-origin:160px 150px;transition:filter .4s}
.kv .float{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.kv .shadow{fill:#000;opacity:.13;transform-box:fill-box;transform-origin:center;animation:shd 3.4s ease-in-out infinite}
@keyframes shd{0%,100%{transform:scaleX(1);opacity:.14}50%{transform:scaleX(.84);opacity:.08}}
.kv.speak .bodyg{animation:talk .34s ease-in-out infinite alternate}
@keyframes talk{from{transform:scale(1)}to{transform:scale(1.03,.975)}}
.kv.listen .bodyg{animation:lis 1.2s ease-in-out infinite}
@keyframes lis{0%,100%{transform:rotate(-3deg) scale(1.02)}50%{transform:rotate(3deg) scale(1.02)}}
.kv.think .bodyg{animation:thk 1.8s ease-in-out infinite}
@keyframes thk{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}70%{transform:rotate(4deg)}}
.kv .ev{opacity:0;transition:opacity .18s}
.kv svg[data-e=normal] .e-normal,.kv svg[data-e=happy] .e-happy,.kv svg[data-e=angry] .e-angry,.kv svg[data-e=love] .e-love,.kv svg[data-e=think] .e-think,.kv svg[data-e=sad] .e-sad,.kv svg[data-e=wow] .e-wow,.kv svg[data-e=wide] .e-wide{opacity:1}
.kv .ev *{fill:var(--eye)}
.kv .ev .ln{fill:none;stroke:var(--eye);stroke-width:9;stroke-linecap:round}
.kv .ev .hl{fill:#fff}
.kv .lid{transform-box:fill-box;transform-origin:center;transition:transform .07s}
.kv .blink .lid{transform:scaleY(.08)}
.kv .look{transition:transform .25s ease-out}
.kv #mth{fill:none;stroke:var(--eye);stroke-width:8;stroke-linecap:round;transition:d .25s}
.kv #mo{fill:var(--eye)}
.kv .fl{opacity:0;transform:translateY(40px) scale(.5);transform-box:view-box;transform-origin:160px 95px;transition:opacity .35s,transform .45s cubic-bezier(.34,1.56,.64,1)}
.kv[data-fire="1"] .fl{opacity:1;transform:none}
.kv .fl path{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
.kv .fl path:nth-child(2n){animation-duration:.42s;animation-delay:-.2s}
.kv .fl path:nth-child(3n){animation-duration:.6s;animation-delay:-.1s}
@keyframes flick{from{transform:scaleY(.86) skewX(-4deg)}to{transform:scaleY(1.12) skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.kv .float,.kv .shadow,.kv .bodyg,.aura,.kv .fl path{animation:none!important}}
.st{display:flex;align-items:center;justify-content:center;gap:8px;min-height:24px;margin-top:6px;font-size:14px;font-weight:600;color:var(--dim)}
.bars{display:none;align-items:center;height:18px}
.bars i{display:block;width:3px;height:5px;margin:0 1.5px;border-radius:2px;background:var(--kc);animation:eq .8s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:-.15s}.bars i:nth-child(3){animation-delay:-.3s}.bars i:nth-child(4){animation-delay:-.45s}.bars i:nth-child(5){animation-delay:-.6s}.bars i:nth-child(6){animation-delay:-.7s}.bars i:nth-child(7){animation-delay:-.25s}
@keyframes eq{0%,100%{height:4px}50%{height:17px}}
.st.speak .bars,.st.listen .bars,.st.think .bars{display:flex}
.st.listen .bars i{background:var(--red)}
.st.think .bars i{animation-duration:1.4s;opacity:.6}
.tr{width:100%;max-width:660px;text-align:center;margin-top:8px;max-height:30vh;overflow-y:auto;padding:0 4px;scrollbar-width:thin}
.tr p{margin:4px 0;font-size:15px}
.tr b{font:700 11px/1 "Golos Text",sans-serif;letter-spacing:.08em;color:var(--dim);margin-right:6px;vertical-align:1px}
.tr .you span{color:var(--dim)}
.tr .ai span{font-size:16.5px}
.tr .ai span q{quotes:none;font-weight:700;color:var(--kc);transition:color .4s}
.go{margin-top:10px;border:0;border-radius:999px;background:var(--ink);color:var(--bg);font-weight:700;font-size:16px;padding:12px 22px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.qk{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.qk button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
.ctl{display:flex;align-items:center;justify-content:center;gap:14px;padding:10px 16px 4px}
.mic{width:68px;height:68px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:28px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 10px 26px rgba(0,0,0,.22);transition:transform .15s,background .2s}
.mic.on{background:var(--red);color:#fff;transform:scale(1.08);box-shadow:0 0 0 10px rgba(239,68,68,.18)}
.lg{min-width:52px}
.tf{display:flex;gap:8px;max-width:660px;width:calc(100% - 32px);margin:6px auto 0}
.tf[hidden]{display:none}
.tf input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;font:16px "Golos Text",sans-serif;outline:none}
.tf input:focus{border-color:var(--kc)}
.tf button{border:0;border-radius:14px;background:var(--ink);color:var(--bg);padding:0 16px;font-size:18px;cursor:pointer}
.hint{text-align:center;color:var(--dim);font-size:12.5px;margin:6px 16px calc(10px + env(safe-area-inset-bottom))}
kbd{font:600 11px "Golos Text",sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:1px 6px;background:var(--card)}
.sheet{position:fixed;inset:0;z-index:2500;background:rgba(10,12,20,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--card);color:var(--ink);width:min(560px,100%);max-height:86vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.sheet{align-items:center}.sheet .in{border-radius:22px}}
.sheet h2{font:800 17px/1.2 Unbounded,sans-serif;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.sheet h2 button{margin-left:auto}
.sheet h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:16px 0 6px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer}
.opt input{margin-top:3px}
.opt small{display:block;color:var(--dim);font-size:12.5px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row input[type=text],.row input[type=password]{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:9px 10px;font:14px "Golos Text",sans-serif}
.note{font-size:13px;color:var(--dim);background:var(--bg);border-radius:12px;padding:10px 12px;margin:8px 0}
.note b{color:var(--ink)}
.hist p{margin:0 0 8px;padding:8px 11px;border-radius:12px;background:var(--bg);font-size:14.5px}
.hist p.u{background:transparent;border:1px dashed var(--line);color:var(--dim)}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:3000;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (max-width:760px){.top{padding:54px 12px 2px}.top h1{font-size:14px}}
@media (max-width:420px){.top h1{display:none}.top{justify-content:flex-end}.ib{min-width:40px;height:40px;padding:0 8px}}
@media (max-height:640px){.kv svg{width:min(60vw,260px,36vh)}.tr{max-height:24vh}.mic{width:60px;height:60px}}
</style>
</head>
<body>

<div class="sheet" id="sCfg" role="dialog" aria-modal="true" aria-labelledby="cfgH"><div class="in">

  <div class="row"><button class="ib" type="button" id="pLogin">🌐 Puter'ga ulash</button></div>
  <label class="opt"><input type="radio" name="en" value="off"><span><b>Oflayn</b><small>Internetsiz: tayyor mashqlar, grammatika tuzatish, misollar, mantiq</small></span></label>

  catch (e) { toast("Puter ulanmadi: " + String(e && e.message || e).slice(0, 60)); }
});
$("#cVoice").addEventListener("change", function () { C.voice = this.checked; saveCfg(); if (!C.voice) stopSpeak(); });
$("#cRate").addEventListener("input", function () { C.rate = +this.value; $("#cRateV").textContent = "×" + C.rate.toFixed(2); saveCfg(); });
$("#cAuto").addEventListener("change", function () { C.auto = this.checked; saveCfg(); });
$$("input[name=vg]").forEach(function (r) { r.addEventListener("change", function () { C.vg = r.value; saveCfg(); stopSpeak(); var md = r.value === "m" ? "strict" : "happy"; setMood(md); say(r.value === "m" ? "Mana, erkak ovozim. Jahlim chiqsa shunday gapiraman!" : r.value === "f" ? "Salom! Endi doim shu ovozda gapiraman." : "Odatda muloyim gapiraman, jahlim chiqsa — ovozim o'zgaradi!"); }); });
$("#cTease").addEventListener("change", function () { C.tease = this.checked; saveCfg(); toast(C.tease ? "Tegajoq hazil yoqildi 😜" : "Tegajoq hazil o'chirildi"); });
$$("[data-th]").forEach(function (b) { b.addEventListener("click", function () { C.theme = b.getAttribute("data-th"); saveCfg(); applyTheme(); }); });
$("#bHist").addEventListener("click", function () {
  var h = cur().h, L = $("#histL");
  L.innerHTML = h.length ? h.map(function (x) { return "<p class=\"" + x.r + "\"><b>" + (x.r === "u" ? "Siz" : "Kuvi") + ":</b> " + (x.r === "a" ? fmtAI(x.t) : esc(x.t)) + "</p>"; }).join("") : "<p>Hali suhbat yo'q.</p>";
  openSheet("#sHist"); L.scrollTop = L.scrollHeight;
});
$("#hClear").addEventListener("click", function () { CH[C.mode] = { h: [], st: {} }; saveChat(); closeSheets(); intro(false); });
document.addEventListener("visibilitychange", function () { if (document.hidden) { stopSpeak(); if (recOn) micStop(); } });

/* ================= Ishga tushirish ================= */
drawModes(); drawLang(); render(); setState("idle"); restore();
if (!hasSR) { showKbd(true); $("#hint").textContent = "Brauzeringiz ovozni tanimaydi — yozib yuboring. Ovoz bilan gaplashish uchun Chrome yoki Edge'da oching."; $("#mic").hidden = true; }
if (C.engine === "off") drawEng("off");
else if (C.engine === "auto" && !fbOff()) fbLoad().catch(function (e) { engFail("fb", e); });
window.kaUstoz = { send: send, say: say, setMood: setMood, state: function () { return { S: S, mood: mood, eng: lastEng, h: cur().h }; }, segs: segs, toTr: toTr, toCyr: toCyr, speakable: speakable };
})();
</script>
