<style>
:root{--bg:#0b1220;--bg-soft:#111a2e;--card:#141f38;--border:#243252;--text:#eef2ff;--text-dim:#9fb0d0;--accent:#5ee6c7;--accent-2:#7c9bff;--bad:#ff8585;--warn:#ffd479}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 0%,#16213f 0%,var(--bg) 55%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
header{padding:22px 0;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;color:inherit;text-decoration:none}
.brand-badge{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;color:#08131f;font-weight:800}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:10px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit;color:var(--text)}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#081019}
.btn-ghost{border-color:var(--border);background:var(--bg-soft)}
.btn:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.hidden{display:none!important}

.sinf-nav{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 10px}
.sinf-nav a{text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:13.5px;font-weight:600}
.sinf-nav a.on{background:rgba(94,230,199,.12);border-color:var(--accent);color:var(--accent)}
.sinf-nav a.soon{opacity:.45;pointer-events:none}

.book{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start;margin-top:14px}
@media (max-width:860px){.book{grid-template-columns:1fr}}
.toc{position:sticky;top:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;max-height:calc(100vh - 24px);overflow:auto}
@media (max-width:860px){.toc{position:static;max-height:none}}
.toc h3{margin:0 0 8px;font-size:14px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.06em}
.toc details{margin-bottom:6px}
.toc summary{cursor:pointer;font-weight:600;font-size:13.5px;padding:5px 6px;border-radius:8px;list-style:none;display:flex;align-items:center;gap:6px}
.toc summary::-webkit-details-marker{display:none}
.toc summary:hover{background:var(--bg-soft)}
.toc a{display:flex;gap:6px;align-items:flex-start;font-size:12.5px;color:var(--text-dim);text-decoration:none;padding:4px 8px 4px 20px;border-radius:8px}
.toc a:hover{color:var(--text);background:var(--bg-soft)}
.toc a.done::before{content:"✓";color:var(--accent);font-weight:700}
.toc a:not(.done)::before{content:"·";color:var(--border)}
.toc .prog{height:6px;background:var(--bg-soft);border-radius:999px;overflow:hidden;margin:6px 0 12px}
.toc .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2))}

.hero{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:22px 24px;margin-bottom:18px}
.kicker{display:inline-block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(94,230,199,.35);background:rgba(94,230,199,.08);padding:4px 11px;border-radius:999px;margin-bottom:10px}
h1{font-size:clamp(24px,4vw,34px);margin:0 0 10px;letter-spacing:-.02em}
.hero p{color:var(--text-dim);margin:0 0 12px;font-size:15px}
.pdfs{display:flex;gap:8px;flex-wrap:wrap}

.bob{margin:0 0 26px}
.bob > h2{font-size:21px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.mavzu{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 22px;margin:0 0 14px;scroll-margin-top:14px}
.mavzu h3{margin:0 0 4px;font-size:18px}
.mavzu .meta{font-size:12.5px;color:var(--text-dim);margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mavzu .meta a{color:var(--accent-2);text-decoration:none}
.sec{margin-top:12px}
.sec h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.qoida p{margin:0 0 8px;font-size:15px;background:var(--bg-soft);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0}
.misol{background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:14.5px}
.misol .mq{font-weight:600}
.misol .ma{display:none;margin-top:6px;color:var(--text-dim);border-top:1px dashed var(--border);padding-top:6px}
.misol.open .ma{display:block}
.misol button{margin-top:6px;font-size:12px;color:var(--accent-2);background:none;border:none;cursor:pointer;padding:0;font-family:inherit}
.mashq ol{margin:0;padding-left:22px;font-size:14.5px}
.mashq li{margin-bottom:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.done-btn.on{border-color:var(--accent);color:var(--accent)}

.quiz{background:var(--bg-soft);border:1px solid var(--accent);border-radius:12px;padding:16px;margin-top:12px;display:none}
.quiz.on{display:block}
.quiz .qh{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-bottom:8px}
.quiz .qq{font-size:17px;font-weight:600;margin:0 0 12px}
.quiz .qo{display:grid;gap:8px;margin-bottom:10px}
.quiz .qo button{text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-family:inherit;font-size:15px}
.quiz .qo button.correct{border-color:var(--accent);background:rgba(94,230,199,.12)}
.quiz .qo button.wrong{border-color:var(--bad);background:rgba(255,133,133,.12)}
.quiz .qf{font-size:13px;color:var(--text-dim);min-height:20px;margin-bottom:8px}
.quiz .qf ul{margin:4px 0 0 18px;padding:0}
.quiz .qr{text-align:center;padding:8px 0}
.quiz .qr .sc{font-size:34px;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.navrow{display:flex;justify-content:space-between;gap:10px;margin:10px 0 30px}
footer{border-top:1px solid var(--border);padding:28px 0;color:var(--text-dim);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-top:30px}
footer a{color:var(--accent);text-decoration:none}
@media print{body{background:#fff;color:#000}.toc,.knav-head,.sinf-nav,.acts,.quiz,footer,.pdfs,.navrow{display:none!important}.mavzu,.hero,.misol{border-color:#000;background:#fff;color:#000}.qoida p{background:#fff;border-left-color:#000;color:#000}.misol .ma{display:block;color:#000}.sec h4{color:#000}}
</style>

<script>
(function(){
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
var S=window.kaSavol, LS='ka.kitob.v1', st={};
try{st=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(st))}catch(e){}}
var m=location.search.match(/[?&]sinf=(\d+)/), K=m?+m[1]:5; if(K<1||K>11)K=5;
var nav=$('#sinfNav');
for(var i=1;i<=11;i++)nav.insertAdjacentHTML('beforeend','<a href="kitob.html?sinf='+i+'" class="'+(i===K?'on':'')+'">'+i+'-sinf</a>');

var s=document.createElement('script');s.src='kitob-data/sinf-'+K+'.js?v=20261101';s.onload=render;s.onerror=function(){$('#main').innerHTML='<div class="hero"><h1>'+K+'-sinf kitobi hali tayyor emas</h1><p>Boshqa sinfni tanlang yoki <a href="darsliklar.html#sinf-'+K+'" style="color:var(--accent)">darslik PDF</a> ni oching.</p></div>';$('#toc').innerHTML=''};
document.head.appendChild(s);

function render(){
 var B=(window.KA_KITOB||{})[K];if(!B){s.onerror();return}
 var all=[];B.boblar.forEach(function(b){b.mavzular.forEach(function(t){all.push(t)})});
 var done=all.filter(function(t){return st[t.id]&&st[t.id].done}).length;
 // TOC
 var h='<h3>'+K+'-sinf · Mundarija</h3><div class="prog"><i style="width:'+(100*done/all.length)+'%"></i></div><div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">'+done+' / '+all.length+' mavzu o\'qildi</div>';
 B.boblar.forEach(function(b,bi){h+='<details'+(bi<2?' open':'')+'><summary>'+esc(b.nom)+'</summary>'+b.mavzular.map(function(t){return '<a href="#'+t.id+'" class="'+(st[t.id]&&st[t.id].done?'done':'')+'" data-id="'+t.id+'">'+esc(t.nom)+'</a>'}).join('')+'</details>'});
 $('#toc').innerHTML=h;
 // Main
 var mh='<div class="hero"><span class="kicker">📖 Elektron kitob · '+esc(B.bosqich)+'</span><h1>'+K+'-sinf · '+esc(B.nom)+'</h1><p>'+esc(B.kirish)+'</p><div class="pdfs">'+(B.pdf||[]).map(function(p){return '<a class="btn btn-ghost sm" href="'+p.url+'" target="_blank" rel="noopener">📄 '+esc(p.nom)+'</a>'}).join('')+'<a class="btn btn-ghost sm" href="darsliklar.html#sinf-'+K+'">📚 Modullar va PDF</a><a class="btn btn-ghost sm" href="daraja-test.html">🎯 Daraja testi</a></div></div>';
 B.boblar.forEach(function(b){
  mh+='<section class="bob"><h2>'+esc(b.nom)+'</h2>';
  b.mavzular.forEach(function(t,ti){
   var pdf=t.pdf&&B.pdf[t.pdf[0]]?B.pdf[t.pdf[0]]:null;
   var ids=(t.test||[]).filter(function(id){return S&&S.has(id)});
   mh+='<article class="mavzu" id="'+t.id+'"><h3>'+esc(t.nom)+'</h3><div class="meta">'+(pdf?'<a href="'+pdf.url+'#page='+(t.pdf[1]||1)+'" target="_blank" rel="noopener">📄 '+esc(pdf.nom)+(t.pdf[1]>1?', ~'+t.pdf[1]+'-bet':'')+'</a>':'')+(t.mavzu?'<a href="mashqlar.html#'+t.mavzu+'">📘 Saytdagi to\'liq mavzu: '+esc(S&&S.title?S.title(t.mavzu):t.mavzu)+'</a>':'')+'</div>';
   if(t.qoida&&t.qoida.length)mh+='<div class="sec qoida"><h4>Qoida</h4>'+t.qoida.map(function(q){return '<p>'+q+'</p>'}).join('')+'</div>';
   if(t.misol&&t.misol.length)mh+='<div class="sec"><h4>Yechilgan misollar</h4>'+t.misol.map(function(x,i){return '<div class="misol"><div class="mq">'+(i+1)+') '+esc(x[0])+'</div><button type="button" data-toggle>Yechimni ko\'rsatish</button><div class="ma">'+esc(x[1])+'</div></div>'}).join('')+'</div>';
   if(t.mashq&&t.mashq.length)mh+='<div class="sec mashq"><h4>Mashqlar</h4><ol>'+t.mashq.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ol></div>';
   mh+='<div class="acts">'+(ids.length?'<button type="button" class="btn btn-primary sm" data-test="'+t.id+'">🧪 Test — 10 savol</button>':'')+'<button type="button" class="btn btn-ghost sm done-btn'+(st[t.id]&&st[t.id].done?' on':'')+'" data-done="'+t.id+'">'+(st[t.id]&&st[t.id].done?'✓ O\'qildi':'O\'qildi deb belgilash')+'</button>'+(st[t.id]&&st[t.id].best!=null?'<span style="font-size:12.5px;color:var(--text-dim)">Eng yaxshi natija: '+st[t.id].best+'/10</span>':'')+'</div><div class="quiz" id="qz-'+t.id+'"></div></article>';
  });
  mh+='</section>';
 });
 mh+='<div class="navrow">'+(K>1?'<a class="btn btn-ghost" href="kitob.html?sinf='+(K-1)+'">← '+(K-1)+'-sinf</a>':'<span></span>')+(K<11?'<a class="btn btn-primary" href="kitob.html?sinf='+(K+1)+'">'+(K+1)+'-sinf →</a>':'<a class="btn btn-primary" href="sertifikat.html">🎓 Milliy sertifikat · SAT →</a>')+'</div>';
 $('#main').innerHTML=mh;
 window.KA_ALL=all;
 if(location.hash){var el=document.getElementById(location.hash.slice(1));if(el)el.scrollIntoView()}
}
// interactions
var Q={};
function findT(id){var r=null;(window.KA_ALL||[]).forEach(function(t){if(t.id===id)r=t});return r}
function startQuiz(id){
 var t=findT(id);if(!t||!S)return;var ids=t.test.filter(function(x){return S.has(x)}),qs=[],seen={},g=0;
 while(qs.length<10&&g++<200){var tid=ids[Math.floor(Math.random()*ids.length)],L=1+Math.floor(3*qs.length/10),p=null;try{p=S.get(tid,L)}catch(e){}
  if(!p||!p.q||seen[p.q])continue;seen[p.q]=1;var r=String(p.a),w=shuffle((p.w||[]).map(String).filter(function(x){return x!==r})).slice(0,3);if(!w.length)continue;
  qs.push({q:p.q,a:r,opts:shuffle([r].concat(w)),steps:Array.isArray(p.steps)?p.steps:p.steps?[String(p.steps)]:[]})}
 Q[id]={qs:qs,i:0,ok:0};var box=document.getElementById('qz-'+id);box.classList.add('on');rq(id);box.scrollIntoView({behavior:'smooth',block:'nearest'});
}
function rq(id){
 var q=Q[id],box=document.getElementById('qz-'+id);
 if(q.i>=q.qs.length){var pc=Math.round(100*q.ok/q.qs.length);st[id]=st[id]||{};if(st[id].best==null||q.ok>st[id].best)st[id].best=q.ok;if(pc>=80)st[id].done=true;save();
  box.innerHTML='<div class="qr"><div class="sc">'+q.ok+' / '+q.qs.length+'</div><div style="color:var(--text-dim);font-size:14px">'+(pc>=80?'Zo\'r! Mavzu o\'zlashtirildi ✅ (o\'qildi deb belgilandi)':pc>=60?'Yaxshi — qoidani yana bir o\'qib, qayta urinib ko\'ring':'Qoida va misollarni qayta o\'qing, keyin testni takrorlang')+'</div><div style="margin-top:10px"><button type="button" class="btn btn-primary sm" data-test="'+id+'">🔄 Yangi savollar</button> <button type="button" class="btn btn-ghost sm" data-qclose="'+id+'">Yopish</button></div></div>';
  var a=$('#toc a[data-id="'+id+'"]');if(a&&st[id].done)a.classList.add('done');var d=$('[data-done="'+id+'"]');if(d&&st[id].done){d.classList.add('on');d.textContent='✓ O\'qildi'}return}
 var it=q.qs[q.i];
 box.innerHTML='<div class="qh"><span>Savol '+(q.i+1)+' / '+q.qs.length+'</span><span>To\'g\'ri: '+q.ok+'</span></div><p class="qq">'+esc(it.q)+'</p><div class="qo">'+it.opts.map(function(o,j){return '<button type="button" data-j="'+j+'">'+esc(o)+'</button>'}).join('')+'</div><div class="qf"></div><div style="display:flex;gap:8px;justify-content:space-between"><button type="button" class="btn btn-ghost sm" data-qclose="'+id+'">✕ Yopish</button><button type="button" class="btn btn-primary sm" data-qnext="'+id+'" disabled>Keyingi →</button></div>';
}
$('#main').addEventListener('click',function(e){
 var b;
 if((b=e.target.closest('[data-toggle]'))){var mi=b.closest('.misol');mi.classList.toggle('open');b.textContent=mi.classList.contains('open')?'Yechimni yashirish':'Yechimni ko\'rsatish';return}
 if((b=e.target.closest('[data-done]'))){var id=b.dataset.done;st[id]=st[id]||{};st[id].done=!st[id].done;save();b.classList.toggle('on',st[id].done);b.textContent=st[id].done?'✓ O\'qildi':'O\'qildi deb belgilash';var a=$('#toc a[data-id="'+id+'"]');if(a)a.classList.toggle('done',st[id].done);
  var n=(window.KA_ALL||[]).filter(function(t){return st[t.id]&&st[t.id].done}).length,tot=(window.KA_ALL||[]).length;var p=$('#toc .prog i');if(p)p.style.width=(100*n/tot)+'%';var c=$('#toc .prog + div');if(c)c.textContent=n+' / '+tot+' mavzu o\'qildi';return}
 if((b=e.target.closest('[data-test]'))){startQuiz(b.dataset.test);return}
 if((b=e.target.closest('[data-qclose]'))){document.getElementById('qz-'+b.dataset.qclose).classList.remove('on');return}
 if((b=e.target.closest('[data-qnext]'))){Q[b.dataset.qnext].i++;rq(b.dataset.qnext);return}
 if((b=e.target.closest('.quiz .qo button'))&&!b.disabled){var box=b.closest('.quiz'),id2=box.id.slice(3),q=Q[id2],it=q.qs[q.i],ok=it.opts[+b.dataset.j]===it.a;if(ok)q.ok++;
  box.querySelectorAll('.qo button').forEach(function(x){x.disabled=true;if(it.opts[+x.dataset.j]===it.a)x.classList.add('correct')});if(!ok)b.classList.add('wrong');
  box.querySelector('.qf').innerHTML=(ok?'<span style="color:var(--accent)">✅ To\'g\'ri!</span>':'<span style="color:var(--bad)">❌ To\'g\'ri javob: '+esc(it.a)+'</span>')+(it.steps.length?'<ul>'+it.steps.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>':'');
  box.querySelector('[data-qnext]').disabled=false;box.querySelector('.qh span:last-child').textContent='To\'g\'ri: '+q.ok}
});
})();
</script>
