<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="base-uri 'self'; object-src 'none'; form-action 'self'; media-src 'self'; img-src 'self' data:; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ezop masallari — Reels | Kuvonch Academy</title>
<meta name="description" content="Ezop masallari asosidagi qisqa 9:16 reels videolar: masal, savol va xulosa.">
<meta name="theme-color" content="#0b1220">
<link rel="icon" href="icon-192.png">
<style>
  *{box-sizing:border-box}
  :root{--bg:#0b1220;--panel:#0e1628;--line:#243252;--txt:#eef2ff;--mut:#9fb0d0;--acc:#7c9bff;--ok:#5ee6c7}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden}
  .wrap{max-width:460px;margin:0 auto;padding:18px 16px 60px}
  a.back{color:var(--acc);text-decoration:none;font-weight:700;font-size:14px}
  h1{font-size:clamp(22px,5.5vw,30px);margin:12px 0 4px}
  .sub{color:var(--mut);font-size:14.5px;margin:0 0 18px}
  .reel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:18px}
  .reel h2{font-size:17px;margin:10px 2px 2px}
  .reel .meta{color:var(--mut);font-size:13px;margin:0 2px 4px}
  .frame{position:relative;width:100%;aspect-ratio:9/16;background:#050a14;border-radius:12px;overflow:hidden}
  .frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#050a14}
  .missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px;text-align:center;padding:16px}
  .empty{color:var(--mut);text-align:center;margin-top:40px}
</style>
<style>@media (prefers-reduced-motion:no-preference){@view-transition{navigation:auto}}</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="ezop-oyin.html">&larr; Ezop masallari o'yini</a>
  <h1>Ezop masallari — Reels</h1>
  <p class="sub">Har bir masal 9:16 qisqa video sifatida. Videoni bosib ijro eting.</p>
  <main id="list"></main>
</div>
<script src="ezop-masallar.js"></script>
<script>
(function () {
  var list = document.getElementById('list');
  var items = (window.EZOP_MASALLAR || []).slice().reverse();
  if (!items.length) {
    list.innerHTML = '<p class="empty">Hozircha masal yo\'q.</p>';
    return;
  }
  items.forEach(function (m) {
    var card = document.createElement('section');
    card.className = 'reel';

    var frame = document.createElement('div');
    frame.className = 'frame';

    var missing = document.createElement('div');
    missing.className = 'missing';
    missing.textContent = 'Video hali tayyor emas';
    missing.style.display = 'none';
    frame.appendChild(missing);

    var v = document.createElement('video');
    v.controls = true;
    v.playsInline = true;
    v.preload = 'none';
    v.setAttribute('poster', '');
    v.src = 'media/ezop/' + m.id + '.mp4';
    v.addEventListener('error', function () {
      v.style.display = 'none';
      missing.style.display = 'flex';
    });
    frame.insertBefore(v, missing);

    var h = document.createElement('h2');
    h.textContent = m.sarlavha;
    var meta = document.createElement('p');
    meta.className = 'meta';
    meta.textContent = m.id + ' · ' + m.mavzu;

    card.appendChild(frame);
    card.appendChild(h);
    card.appendChild(meta);
    list.appendChild(card);
  });
})();
</script>
</body>
</html>
