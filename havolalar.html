<style>
:root{--bg:#0b1220;--card:#141f38;--bd:#243252;--tx:#eef2ff;--dim:#9fb0d0;--ac:#5ee6c7}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#1b2a55,transparent),var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:480px;margin:0 auto;padding:36px 16px 60px;text-align:center}
.logo{width:84px;height:84px;border-radius:24px;margin:0 auto 12px;display:block}
h1{font-size:24px;margin:0 0 4px}
p.sub{color:var(--dim);margin:0 0 24px}
a.l{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:15px 16px;margin:10px 0;color:var(--tx);text-decoration:none;font-weight:700}
a.l:hover{border-color:var(--ac)}
a.l.main{background:linear-gradient(135deg,#6a5af9,#8b5cf6);border-color:transparent}
small{display:block;color:var(--dim);margin-top:26px}

<script async src="statistika.js"></script>

<script>
// Statistikada bosilgan havolani ko'rish uchun (anonim)
document.querySelectorAll("a.l").forEach(function (a) {
  a.addEventListener("click", function () { try { if (window.gtag) gtag("event", "havola_bosildi", { havola: a.dataset.c }); } catch (e) {} });
});
// Qaysi tarmoqdan kelgan (?s=ig / yt / tt) — statistikaga yoziladi
try { var s = new URLSearchParams(location.search).get("s"); if (s && window.gtag) gtag("event", "manba", { tarmoq: String(s).slice(0, 12) }); } catch (e) {}
</script>
