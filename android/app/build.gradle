plugins { id "com.android.application" }

android {
    namespace "uz.kuvonch.app"
    compileSdk 34
    defaultConfig {
        applicationId "uz.kuvonch.app"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("KA_KS_FILE") ?: "../kuvonch-release.jks")
            storePassword System.getenv("KA_KS_PASS")
            keyAlias "kuvonch"
            keyPassword System.getenv("KA_KS_PASS")
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
        debug { signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.1.0"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "androidx.core:core-splashscreen:1.0.1"
}

configurations.all {
    resolutionStrategy {
        force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24", "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24", "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
    }
}
